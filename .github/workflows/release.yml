name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    # Required for npm OIDC trusted publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: |
          # Get the tag name (e.g., v1.2.3)
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Remove the 'v' prefix to get the version (e.g., 1.2.3)
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          echo "Updated package.json to version ${{ steps.version.outputs.VERSION }}"
          cat package.json | grep '"version"'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build package
        run: npm run build

      # Publish using OIDC trusted publishing (no token required)
      # Requires npm >= 11.5.1 (bundled with Node.js 22+)
      # Configure trusted publisher at: https://www.npmjs.com/package/transformer-bee-client/access
      # See: https://docs.npmjs.com/trusted-publishers/
      - name: Publish to npm
        run: npm publish --access public
